[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aive-protocol"
version = "0.2.0"
description = "AIVE: AI-Validated Exploit exploit-to-patch automation for GitHub repositories"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Waleed Ajmal" }
]
keywords = ["ai", "security", "github", "patching", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance"
]

[project.scripts]
aive = "aive.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
# Optional rich terminal UI: enables `aive tui`, `--pretty`, colour tables,
# spinners and progress bars. The core toolkit stays zero-dependency without it.
ui = ["rich>=13"]

[tool.setuptools]
packages = ["aive"]
