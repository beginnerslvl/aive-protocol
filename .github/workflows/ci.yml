name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -ra

  smoke:
    name: cli smoke (scan -> plan -> verify)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Scan this repository
        run: aive scan . --output artifacts/findings.json --min-confidence 0.8

      - name: Render patch plan
        run: aive plan artifacts/findings.json --output artifacts/patch-plan.md

      - name: Verify (strict, JSON)
        run: aive verify . --strict --json | tee artifacts/verification.json

      - name: Module entry point works
        run: python -m aive --version

      - name: Upload CLI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aive-cli-smoke
          path: artifacts/
